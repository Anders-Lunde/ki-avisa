<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="KI-avisa — nettsted under arbeid.">
  <title>KI-avisa — under arbeid</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20242b; background: #f6f4ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; align-items: center; padding: 2rem; }
    main { width: min(100%, 58rem); margin: 0 auto; padding: clamp(2rem, 7vw, 5rem) 0; border-top: 5px solid #2d5371; }
    .status { font-size: .8rem; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-size: clamp(3.2rem, 12vw, 7.5rem); font-weight: 700; letter-spacing: -.065em; line-height: 1; margin: 2rem 0; overflow-wrap: anywhere; }
    .message { font-size: clamp(1.2rem, 3vw, 1.6rem); line-height: 1.6; max-width: 35rem; }
  </style>
</head>
<body>
  <main>
    <p class="status">Nettsted under arbeid</p>
    <h1>KI-avisa</h1>
    <p class="message">Vi arbeider med nettstedet. Mer informasjon kommer her.</p>
  </main>
</body>
</html>
