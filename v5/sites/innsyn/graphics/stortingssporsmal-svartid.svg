<text x="16" y="683" font-size="12" fill="#23312f">Kommunal og distrikt</text>
<rect x="182" y="672" width="93.9" height="12" rx="2" fill="#58645e"/>
<text x="16" y="702" font-size="12" fill="#23312f">Samferdsel</text>
<rect x="182" y="691" width="72.0" height="12" rx="2" fill="#58645e"/>
<text x="259.0" y="702" font-size="12" font-weight="700" fill="#23312f">15 %</text>
<text x="16" y="721" font-size="12" fill="#23312f">Klima og miljø</text>
<rect x="182" y="710" width="70.0" height="12" rx="2" fill="#58645e"/>
<text x="16" y="740" font-size="12" fill="#23312f">Kultur og likestilling</text>
<rect x="182" y="729" width="59.2" height="12" rx="2" fill="#58645e"/>
<line x1="302.5" y1="376" x2="302.5" y2="749" stroke="#a93828" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="306.5" y="374" font-size="12" fill="#a93828">Alle: 25 %</text>
<text x="16" y="787" font-size="11" fill="#58645e">Kilde: Stortingets åpne data, uttrekk 6.11.2026. KI-avisas beregning.</text>
<text x="16" y="802" font-size="11" fill="#58645e">Registrert svardato er ikke alltid datoen på svarbrevet.</text>
<text x="16" y="817" font-size="11" fill="#58645e">«Etter fristen» betyr ikke regelbrudd: statsråden kan varsle om senere svar.</text>
