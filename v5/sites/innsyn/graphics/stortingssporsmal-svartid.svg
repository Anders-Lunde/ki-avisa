<text x="394.8" y="398" font-size="12" font-weight="700" fill="#23312f">43 %</text>
<text x="16" y="417" font-size="12" fill="#23312f">Helse og omsorg</text>
<rect x="182" y="406" width="185.6" height="12" rx="2" fill="#58645e"/>
<text x="372.6" y="417" font-size="12" font-weight="700" fill="#23312f">38 %</text>
<text x="16" y="436" font-size="12" fill="#23312f">Forskning og høyere utd.</text>
<rect x="182" y="425" width="166.0" height="12" rx="2" fill="#58645e"/>
<text x="16" y="455" font-size="12" fill="#23312f">Finans</text>
<rect x="182" y="444" width="138.7" height="12" rx="2" fill="#58645e"/>
<text x="16" y="474" font-size="12" fill="#23312f">Statsministeren</text>
<rect x="182" y="463" width="138.1" height="12" rx="2" fill="#58645e"/>
<text x="16" y="493" font-size="12" fill="#23312f">Næring</text>
<rect x="182" y="482" width="138.0" height="12" rx="2" fill="#58645e"/>
<text x="16" y="512" font-size="12" fill="#23312f">Landbruk og mat</text>
<rect x="182" y="501" width="135.2" height="12" rx="2" fill="#58645e"/>
<text x="16" y="531" font-size="12" fill="#23312f">Kunnskap (skole)</text>
<rect x="182" y="520" width="129.3" height="12" rx="2" fill="#58645e"/>
<text x="16" y="550" font-size="12" fill="#23312f">Arbeid og inkludering</text>
<rect x="182" y="539" width="127.3" height="12" rx="2" fill="#58645e"/>
<text x="16" y="569" font-size="12" fill="#23312f">Utenriks</text>
<rect x="182" y="558" width="122.4" height="12" rx="2" fill="#58645e"/>
<text x="16" y="588" font-size="12" fill="#23312f">Justis og beredskap</text>
<rect x="182" y="577" width="121.4" height="12" rx="2" fill="#58645e"/>
<text x="16" y="607" font-size="12" fill="#23312f">Fiskeri og hav</text>
<rect x="182" y="596" width="114.1" height="12" rx="2" fill="#58645e"/>
<text x="16" y="626" font-size="12" fill="#23312f">Forsvar</text>
<rect x="182" y="615" width="113.8" height="12" rx="2" fill="#58645e"/>
<text x="16" y="645" font-size="12" fill="#23312f">Energi</text>
<rect x="182" y="634" width="113.7" height="12" rx="2" fill="#58645e"/>
<text x="16" y="664" font-size="12" fill="#23312f">Barn og familie</text>
