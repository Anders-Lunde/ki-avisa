<rect x="432.7" y="239.2" width="30.3" height="4.8" rx="2" fill="#a93828"/>
<text x="447.8" y="259" font-size="11" text-anchor="middle" fill="#58645e">12+</text>
<line x1="270.2" y1="80" x2="270.2" y2="244" stroke="#23312f" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="276.2" y="92" font-size="12" font-weight="700" fill="#23312f">Fristen: 6 hverdager</text>
<text x="233.8" y="104.7" font-size="12" text-anchor="end" fill="#23312f">40 % på fristdagen</text>
<text x="290.3" y="195.6" font-size="12" fill="#a93828">13 % én hverdag etter</text>
<text x="44" y="276" font-size="11" fill="#58645e">Lørdag teller. Søndag, helligdager og antatte påske- og juledager teller ikke.</text>
<text x="16" y="316" font-size="17" font-weight="700" fill="#23312f">Andel svar registrert etter fristen</text>
<text x="16" y="336" font-size="13" fill="#58645e">Etter statsrådsposten spørsmålet gikk til, 2023–2026.</text>
<text x="16" y="352" font-size="13" fill="#58645e">Poster med minst 100 svar. To poster kan høre til samme departement.</text>
