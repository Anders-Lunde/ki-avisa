<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 830" width="480" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Registrert svartid for skriftlige spørsmål til statsrådene</title>
<rect width="480" height="830" fill="#fffdf7"/>
<text x="16" y="28" font-size="17" font-weight="700" fill="#23312f">Når er svaret registrert?</text>
<text x="16" y="48" font-size="13" fill="#58645e">Hverdager fra Stortinget sendte spørsmålet til registrert svardato.</text>
<text x="16" y="64" font-size="13" fill="#58645e">Andel av 10 190 besvarte spørsmål  2023–2026.</text>
