<text x="120" y="393" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">Oslo II-avtalen</text>
<text x="120" y="411" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Mot vold, terror og oppfordring til vold,</text>
<text x="120" y="428" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">med krav om respekt for menneskerettighetene</text>
<path d="M12 430H468" stroke="#cbd0c5" stroke-width="0.6"/>
<text x="12" y="459" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">7.12.1995</text>
<rect x="98" y="448" width="12" height="12" rx="1.5" fill="#23312f"/>
<text x="120" y="459" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">Palestinsk valglov</text>
<text x="120" y="477" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Sikkerhetsorganene skal være nøytrale</text>
<text x="120" y="494" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">gjennom hele valgprosessen</text>
