<text x="120" y="345" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Vanlig politiarbeid, vern av folk og eiendom,</text>
<text x="120" y="362" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">kriminalitetsforebygging i samsvar med loven</text>
