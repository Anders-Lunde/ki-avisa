<text x="40" y="78.5" font-size="12.5" fill="#23312f" font-family="Arial, Helvetica, sans-serif">Forslag eller råd</text>
<rect x="166" y="68" width="12" height="12" rx="1.5" fill="#23312f"/>
<text x="188" y="78.5" font-size="12.5" fill="#23312f" font-family="Arial, Helvetica, sans-serif">Avtale eller lov</text>
<path d="M318 66 L326 74 L318 82 L310 74 Z" fill="#a93828"/>
<text x="334" y="78.5" font-size="12.5" fill="#23312f" font-family="Arial, Helvetica, sans-serif">Observert praksis</text>
