<text x="120" y="129" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">Møtereferat fra Oslo</text>
<text x="120" y="147" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Singer foreslår ifølge referatet å hjelpe Fatah</text>
<text x="120" y="164" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">med å ta kontroll over opposisjonsgrupper</text>
<path d="M12 166H468" stroke="#cbd0c5" stroke-width="0.6"/>
<text x="12" y="195" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">13.9.1993</text>
<rect x="98" y="184" width="12" height="12" rx="1.5" fill="#23312f"/>
<text x="120" y="195" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">Prinsipperklæringen</text>
<text x="120" y="213" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Et palestinsk råd skal opprette en sterk</text>
<text x="120" y="230" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">politistyrke for orden og indre sikkerhet</text>
