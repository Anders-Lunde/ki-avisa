<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 578" width="480" height="578" role="img" aria-labelledby="pp-oslo-t pp-oslo-d">
<title id="pp-oslo-t">Fra forslag til valgdag: palestinsk politi i dokumentene 1993–1996</title>
<desc id="pp-oslo-d">Åpen sirkel er forslag eller råd, fylt firkant er avtale eller lov, rød rombe er observert praksis. 28.6.1993: Møtereferat fra Oslo. Singer foreslår ifølge referatet å hjelpe Fatah med å ta kontroll over opposisjonsgrupper; 13.9.1993: Prinsipperklæringen. Et palestinsk råd skal opprette en sterk politistyrke for orden og indre sikkerhet; 3.11.1993: Bleikelias rapport for FN. Advarer mot politi uten at domstoler, påtale og fengsler bygges opp samtidig; 4.5.1994: Gaza–Jeriko-avtalen. Vanlig politiarbeid, vern av folk og eiendom, kriminalitetsforebygging i samsvar med loven; 28.9.1995: Oslo II-avtalen. Mot vold, terror og oppfordring til vold, med krav om respekt for menneskerettighetene; 7.12.1995: Palestinsk valglov. Sikkerhetsorganene skal være nøytrale gjennom hele valgprosessen; 20.1.1996: Valgdagen i Gaza. PCHR: Politifolk grep i enkelte valglokaler inn til fordel for noen kandidater</desc>
<rect width="480" height="578" fill="#fffdf7"/>
<text x="12" y="26" font-size="17" fill="#23312f" font-family="Georgia, Times New Roman, serif" font-weight="700">Fra forslag til valgdag</text>
<text x="12" y="45" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Forslag, avtaler og observasjoner, 1993–1996</text>
