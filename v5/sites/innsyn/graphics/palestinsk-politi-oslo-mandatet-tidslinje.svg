<text x="120" y="261" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">Bleikelias rapport for FN</text>
<text x="120" y="279" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Advarer mot politi uten at domstoler, påtale</text>
<text x="120" y="296" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">og fengsler bygges opp samtidig</text>
