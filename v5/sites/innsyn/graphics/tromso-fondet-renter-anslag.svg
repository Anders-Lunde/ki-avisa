<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 522" width="360" height="522" font-family="Arial, Helvetica, sans-serif">
<title>Fondets resultat og statens anslåtte renter i ulike perioder</title>
<rect width="360" height="522" fill="#fffdf7"/>
<text x="16" y="30" font-size="19" font-weight="700" fill="#23312f">Resultat og anslåtte renter</text>
<text x="16" y="53" font-size="14" fill="#58645e">Millioner kroner. Rentene må anslås fordi</text>
<text x="16" y="71" font-size="14" fill="#58645e">statens lån ikke er øremerket fondet.</text>
<text x="16" y="106" font-size="16" font-weight="700" fill="#23312f">Fra oppstart til 30.9.2026</text>
<text x="16" y="128" font-size="13.5" fill="#58645e">Fondets resultat etter forvaltningskostnader</text>
<rect x="16" y="134" width="147.4" height="22" rx="2" fill="#23312f"/>
<text x="157" y="150.5" font-size="15" font-weight="700" text-anchor="end" fill="#fffdf7">351</text>
<rect x="164.15" y="134.75" width="82.1" height="20.5" fill="none" stroke="#58645e" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="254" y="145" font-size="13.5" fill="#23312f">omtrent</text>
<text x="254" y="162" font-size="13.5" fill="#23312f">200 mindre</text>
<text x="16" y="180" font-size="13.5" fill="#58645e">Finansdepartementets anslag (usikkert)</text>
<rect x="16" y="186" width="231" height="22" rx="2" fill="#a93828"/>
<text x="241" y="202.5" font-size="15" font-weight="700" text-anchor="end" fill="#fffdf7">ca. 550</text>
<text x="16" y="232" font-size="13.5" fill="#58645e">KI-avisas kontroll med Norges Banks tall</text>
<rect x="16.75" y="238.75" width="237.9" height="20.5" rx="2" fill="none" stroke="#a93828" stroke-width="1.5"/>
<line x1="251.2" y1="238" x2="251.2" y2="260" stroke="#a93828" stroke-width="1.5"/>
<text x="243" y="254.5" font-size="15" font-weight="700" text-anchor="end" fill="#23312f">rundt 560–570</text>
<text x="16" y="279" font-size="13.5" fill="#58645e">To egne regnemåter, ikke et usikkerhetsintervall.</text>
<line x1="16" y1="296" x2="344" y2="296" stroke="#cbd0c5" stroke-width="1"/>
<text x="16" y="322" font-size="16" font-weight="700" fill="#23312f">Oktober–desember 2026</text>
<text x="16" y="342" font-size="13.5" fill="#58645e">Ingen anslag i svarene.</text>
<line x1="16" y1="358" x2="344" y2="358" stroke="#cbd0c5" stroke-width="1"/>
<text x="16" y="384" font-size="16" font-weight="700" fill="#23312f">Hele 2027</text>
<text x="16" y="406" font-size="13.5" fill="#58645e">Finansdepartementets anslag (usikkert)</text>
<rect x="16" y="412" width="294" height="22" rx="2" fill="#a93828"/>
<text x="304" y="428.5" font-size="15" font-weight="700" text-anchor="end" fill="#fffdf7">ca. 700</text>
<text x="16" y="454" font-size="13.5" fill="#58645e">Avkastning: Departementet lager ikke anslag.</text>
<line x1="16" y1="468" x2="344" y2="468" stroke="#23312f" stroke-width="1.5"/>
<text x="16" y="490" font-size="14" font-weight="700" fill="#23312f">Ulike perioder. Ikke legg sammen tallene.</text>
<text x="16" y="512" font-size="13" fill="#58645e">Kilder: Finansdepartementet, Norges Bank, KI-avisa.</text>
</svg>
