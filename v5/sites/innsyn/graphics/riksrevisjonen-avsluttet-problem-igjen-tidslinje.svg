<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1000" width="480" height="1000" font-family="Arial, Helvetica, sans-serif">
<title>Tre oppfølgingsløp hos Riksrevisjonen og 49 av 108 avslutninger</title>
<rect width="480" height="1000" fill="#fffdf7"/>
<text x="16" y="30" font-size="19" font-weight="700" fill="#23312f">Avsluttet, men ikke nødvendigvis løst</text>
<text x="16" y="52" font-size="14" fill="#58645e">Riksrevisjonens oppfølgingsrapporter 2014–2025</text>
<text x="16" y="84" font-size="15" font-weight="700" fill="#23312f">108 avslutninger, delt inn av KI-avisa</text>
