<text x="16" y="956" font-size="14" fill="#58645e">Grå tekst: ansvarlig statsråd og regjering</text>
<text x="16" y="984" font-size="12" fill="#58645e">Kilde: Riksrevisjonen. Inndeling og utvalg: KI-avisa.</text>
