<text x="24.0" y="113" font-size="15" font-weight="700" fill="#fffdf7">49</text>
<rect x="219.3" y="94" width="145.2" height="28" fill="#8a948d"/>
<text x="227.3" y="113" font-size="15" font-weight="700" fill="#fffdf7">35</text>
<rect x="364.4" y="94" width="99.6" height="28" fill="#cbd0c5"/>
<text x="372.4" y="113" font-size="15" font-weight="700" fill="#23312f">24</text>
<rect x="16" y="133" width="12" height="12" fill="#a93828"/>
<text x="36" y="144" font-size="14" fill="#23312f">49: et sentralt problem sto uttrykkelig igjen</text>
<rect x="16" y="155" width="12" height="12" fill="#8a948d"/>
<text x="36" y="166" font-size="14" fill="#23312f">35: avgrenset rest, nytt forhold eller uklar effekt</text>
<rect x="16" y="177" width="12" height="12" fill="#cbd0c5"/>
<text x="36" y="188" font-size="14" fill="#23312f">24: ingen konkret rest påpekt – ikke bevis for løst</text>
