<text x="16" y="444" font-size="13" fill="#58645e">Dagtid på hverdager, med ortopeder fra Førde og noen vikarer.</text>
<text x="16" y="462" font-size="13" fill="#58645e">Gjelder dem som bor sør for Sognefjorden.</text>
<rect x="16" y="490" width="14" height="14" fill="#23312f"/>
<text x="38" y="502" font-size="13" fill="#23312f">Åpent i Lærdal</text>
<rect x="160.5" y="490.5" width="13" height="13" fill="#f6f3eb" stroke="#cbd0c5"/>
<text x="182" y="502" font-size="13" fill="#23312f">Stengt: legevakten vurderer, ev. Førde</text>
<rect x="16" y="524" width="448" height="62" fill="#e1e7db"/>
<text x="28" y="548" font-size="15" fill="#23312f" font-weight="700">Lærdal–Førde: 2 t 15 min på dagtid</text>
<text x="28" y="570" font-size="13" fill="#23312f">Om natta går ferjene sjeldnere, og reisen kan ta lenger tid.</text>
