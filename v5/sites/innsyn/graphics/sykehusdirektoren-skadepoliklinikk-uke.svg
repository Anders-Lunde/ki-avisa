<rect x="352" y="186" width="52" height="26" fill="#23312f"/>
<rect x="408" y="186" width="52" height="26" fill="#23312f"/>
<text x="16" y="230" font-size="13" fill="#58645e">Lege på vakt hele døgnet, ortoped på bakvakt i Lærdal. De fleste</text>
<text x="16" y="248" font-size="13" fill="#58645e">pasientene kom mellom kl. 8 og 16.</text>
