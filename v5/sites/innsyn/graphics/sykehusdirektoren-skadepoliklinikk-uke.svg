<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 602" width="480" height="602" font-family="Arial, Helvetica, sans-serif">
<title>Skadepoliklinikken i Lærdal før og etter 1. juni 2026</title>
<desc>To ukeskjemaer. Før 1. juni 2026 var skadepoliklinikken i Lærdal åpen dag, kveld og natt alle ukedager. Fra 1. juni er den etter planen bare åpen på dagtid mandag til fredag; ellers vurderer legevakten pasientene, og de som må videre, skal til Førde, 2 timer og 15 minutter unna på dagtid.</desc>
<rect width="480" height="602" fill="#fffdf7"/>
<text x="16" y="30" font-size="19" fill="#23312f" font-weight="700">Skadepoliklinikken i Lærdal</text>
<text x="16" y="52" font-size="14" fill="#58645e">Når pasienter med lette og moderate skader kan komme</text>
<text x="16" y="92" font-size="15" fill="#23312f" font-weight="700">Før 1. juni 2026</text>
<text x="98.0" y="118" font-size="12" fill="#58645e" text-anchor="middle">Man</text>
<text x="154.0" y="118" font-size="12" fill="#58645e" text-anchor="middle">Tir</text>
