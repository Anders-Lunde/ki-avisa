<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 812" width="480" height="812" font-family="Arial, Helvetica, sans-serif">
<title>Ansvarskjeden fra Stortinget til sykehusdirektøren</title>
<desc>Fem ledd fra Stortinget via helseministeren, Helse Vest og styret i Helse Førde til direktøren, med hva hvert ledd gjorde i saken om ortopedien og skadepoliklinikkene i 2026.</desc>
<rect width="480" height="812" fill="#fffdf7"/>
<text x="16" y="30" font-size="19" fill="#23312f" font-weight="700">Hvem bestemmer over et sykehustilbud?</text>
<text x="16" y="52" font-size="14" fill="#58645e">Ansvarskjeden, og hva hvert ledd gjorde i saken</text>
<rect x="16" y="80" width="176" height="124" fill="#a93828"/>
<text x="28" y="102" font-size="15" fill="#fffdf7" font-weight="700">Stortinget</text>
<text x="28" y="122" font-size="12.5" fill="#fffdf7">Bevilger pengene og kan be</text>
<text x="28" y="139" font-size="12.5" fill="#fffdf7">regjeringen om å gjøre</text>
<text x="28" y="156" font-size="12.5" fill="#fffdf7">noe.</text>
<text x="210" y="96" font-size="12.5" fill="#a93828" font-weight="700">24.2.2026</text>
<text x="210" y="113" font-size="13" fill="#23312f">Ber regjeringen sikre at</text>
<text x="210" y="130" font-size="13" fill="#23312f">skadepoliklinikkene i Lærdal og</text>
<text x="210" y="147" font-size="13" fill="#23312f">Nordfjord blir videreført (56–46).</text>
<text x="210" y="172" font-size="13" fill="#23312f">Stemmer ned forslag om at statsråden</text>
<text x="210" y="189" font-size="13" fill="#23312f">skal avgjøre (44–58).</text>
<path d="M200,84V200" stroke="#cbd0c5" stroke-width="2"/>
<path d="M104.0,206V222" stroke="#58645e" stroke-width="2"/>
<path d="M98.0,218L104.0,226L110.0,218Z" fill="#58645e"/>
<rect x="16" y="230" width="176" height="124" fill="#23312f"/>
<text x="28" y="252" font-size="15" fill="#fffdf7" font-weight="700">Helseministeren</text>
<text x="28" y="272" font-size="12.5" fill="#fffdf7">Utøver statens eierskap.</text>
<text x="28" y="289" font-size="12.5" fill="#fffdf7">Setter økonomiske krav og</text>
<text x="28" y="306" font-size="12.5" fill="#fffdf7">rammer i foretaksmøtet.</text>
<text x="210" y="246" font-size="12.5" fill="#58645e" font-weight="700">10.2.2026</text>
<text x="210" y="263" font-size="13" fill="#23312f">Mener foretaket kan avgjøre saken</text>
<text x="210" y="280" font-size="13" fill="#23312f">selv.</text>
<text x="210" y="305" font-size="12.5" fill="#58645e" font-weight="700">Okt. 2026</text>
<text x="210" y="322" font-size="13" fill="#23312f">Skriver at Stortingets vedtak «anses</text>
<text x="210" y="339" font-size="13" fill="#23312f">som fulgt opp».</text>
<path d="M200,234V350" stroke="#cbd0c5" stroke-width="2"/>
<path d="M104.0,356V372" stroke="#58645e" stroke-width="2"/>
<path d="M98.0,368L104.0,376L110.0,368Z" fill="#58645e"/>
<rect x="16" y="380" width="176" height="91" fill="#23312f"/>
<text x="28" y="402" font-size="15" fill="#fffdf7" font-weight="700">Helse Vest</text>
<text x="28" y="422" font-size="12.5" fill="#fffdf7">Eier Helse Førde. Styret</text>
<text x="28" y="439" font-size="12.5" fill="#fffdf7">skal drive innenfor</text>
<text x="28" y="456" font-size="12.5" fill="#fffdf7">rammene herfra.</text>
<text x="210" y="396" font-size="13" fill="#23312f">Ingen egen beslutning i saken i</text>
<text x="210" y="413" font-size="13" fill="#23312f">dokumentene vi har lest.</text>
<path d="M200,384V467" stroke="#cbd0c5" stroke-width="2"/>
<path d="M104.0,473V489" stroke="#58645e" stroke-width="2"/>
<path d="M98.0,485L104.0,493L110.0,485Z" fill="#58645e"/>
<rect x="16" y="497" width="176" height="124" fill="#23312f"/>
<text x="28" y="519" font-size="15" fill="#fffdf7" font-weight="700">Styret i Helse Førde</text>
<text x="28" y="539" font-size="12.5" fill="#fffdf7">11 medlemmer: 7 oppnevnt</text>
<text x="28" y="556" font-size="12.5" fill="#fffdf7">av eieren, 4 valgt av de</text>
<text x="28" y="573" font-size="12.5" fill="#fffdf7">ansatte. Ansetter</text>
<text x="28" y="590" font-size="12.5" fill="#fffdf7">direktøren.</text>
<text x="210" y="513" font-size="12.5" fill="#58645e" font-weight="700">29.1.2026</text>
<text x="210" y="530" font-size="13" fill="#23312f">Vedtar samlingen. 10–1 for</text>
<text x="210" y="547" font-size="13" fill="#23312f">direktørens forslag om</text>
<text x="210" y="564" font-size="13" fill="#23312f">skadepoliklinikkene.</text>
<text x="210" y="589" font-size="12.5" fill="#58645e" font-weight="700">20.5.2026</text>
<text x="210" y="606" font-size="13" fill="#23312f">Tar dagtidsplanen til orientering.</text>
<path d="M200,501V617" stroke="#cbd0c5" stroke-width="2"/>
<path d="M104.0,623V639" stroke="#58645e" stroke-width="2"/>
<path d="M98.0,635L104.0,643L110.0,635Z" fill="#58645e"/>
<rect x="16" y="647" width="176" height="107" fill="#23312f"/>
<text x="28" y="669" font-size="15" fill="#fffdf7" font-weight="700">Direktøren</text>
<text x="28" y="689" font-size="12.5" fill="#fffdf7">Leder den daglige driften</text>
<text x="28" y="706" font-size="12.5" fill="#fffdf7">og følger styrets</text>
<text x="28" y="723" font-size="12.5" fill="#fffdf7">retningslinjer.</text>
<text x="210" y="663" font-size="12.5" fill="#58645e" font-weight="700">Jan. 2026</text>
<text x="210" y="680" font-size="13" fill="#23312f">Foreslår samlingen og vilkårene.</text>
<text x="210" y="697" font-size="13" fill="#23312f">Vekter innsparingen tyngst.</text>
<text x="210" y="722" font-size="12.5" fill="#58645e" font-weight="700">Mai 2026</text>
<text x="210" y="739" font-size="13" fill="#23312f">Legger fram planen for dagtid.</text>
<path d="M200,651V750" stroke="#cbd0c5" stroke-width="2"/>
<text x="16" y="772" font-size="12.5" fill="#58645e">Pilene viser hvem som styrer hvem. Datoene gjelder saken om</text>
<text x="16" y="789" font-size="12.5" fill="#58645e">ortopedien og skadepoliklinikkene.</text>
</svg>
