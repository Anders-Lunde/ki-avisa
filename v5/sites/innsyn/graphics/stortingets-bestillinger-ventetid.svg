<text x="352.8" y="78" font-size="12" fill="#58645e" text-anchor="middle">Regjeringen Støre</text>
<rect x="16" y="14" width="14" height="10" fill="#a93828"/>
<text x="36" y="23" font-size="12" fill="#23312f">Foreldelsesvedtakene</text>
<rect x="186" y="14" width="14" height="10" fill="#58645e"/>
<text x="206" y="23" font-size="12" fill="#23312f">Andre vedtak på listen</text>
<text x="16" y="42" font-size="11" fill="#58645e">Tid på listen fra vedtaksdato til 25.9.2026, da departementenes budsjettforslag</text>
<text x="16" y="55" font-size="11" fill="#58645e">for 2027 ble godkjent i statsråd. Ikke et mål på tid uten arbeid.</text>
