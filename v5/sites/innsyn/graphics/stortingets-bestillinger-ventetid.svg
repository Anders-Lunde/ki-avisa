<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 594" width="480" height="594" font-family="Arial, Helvetica, sans-serif">
<title>De eldste bestillingene fra Stortinget som departementene fortsatt rapporterer på</title>
<desc>Liggende søyler for 13 anmodningsvedtak fra vedtaksdato til 25. september 2026, da departementenes budsjettproposisjoner for 2027 ble godkjent i statsråd. Søylene viser hvor lenge vedtakene har stått på listen, ikke hvor lenge de har vært uten arbeid. Bakgrunnen viser regjeringen Solberg fram til 14. oktober 2021 og regjeringen Støre etter det. De to foreldelsesvedtakene er uthevet.</desc>
