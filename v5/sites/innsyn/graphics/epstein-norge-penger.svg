<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 618" width="290" height="618" role="img" aria-labelledby="epstein-norge-penger-t epstein-norge-penger-d">
<title id="epstein-norge-penger-t">Fire pengeforløp med to mottakere</title>
<desc id="epstein-norge-penger-d">Fire pengeforløp med to mottakere. Til Terje Rød-Larsen personlig: 250 000 dollar 21. desember 2015 fra Southern Trust Company, ifølge Deutsche Banks oversikt fra 2019, uten oppgitt formål. Til IPI: sjekker fra Gratitude America på 125 000 dollar 12. juni 2017, 100 000 dollar 1. november 2017 og 150 000 dollar 5. april 2019. KPMG fant alle tre i instituttets regnskap i en gjennomgang fra desember 2020. På den første sjekken står det håndskrevet 100,000, som ikke er forklart. Beløpene er ikke lagt sammen.</desc>
<rect width="290" height="618" fill="#fffdf7"/>
<text x="12" y="26" font-size="17" fill="#23312f" font-family="Georgia, Times New Roman, serif" font-weight="700">Pengene: to mottakere</text>
<text x="12" y="44" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Fire pengeforløp.</text>
<text x="12" y="62" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Beløpene er ikke lagt sammen.</text>
<rect x="12" y="80" width="5" height="16" fill="#a93828"/>
<text x="24" y="92" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">Til Terje Rød-Larsen personlig</text>
<rect x="12" y="104" width="266" height="82" fill="#f6f3eb" stroke="#cbd0c5"/>
<rect x="12" y="104" width="4" height="82" fill="#a93828"/>
<text x="26" y="124" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">21.12.2015 · 250 000 dollar</text>
<text x="26" y="140" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">Fra Epsteins selskap Southern Trust</text>
<text x="26" y="156" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">Company, ifølge Deutsche Banks</text>
<text x="26" y="172" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">oversikt fra 2019. Formål ikke oppgitt.</text>
<rect x="12" y="204" width="5" height="16" fill="#23312f"/>
<text x="24" y="216" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">Til fredsinstituttet IPI</text>
<rect x="12" y="228" width="266" height="98" fill="#f6f3eb" stroke="#cbd0c5"/>
<rect x="12" y="228" width="4" height="98" fill="#23312f"/>
<text x="26" y="248" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">12.6.2017 · 125 000 dollar</text>
<text x="26" y="264" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">Sjekk fra Gratitude America.</text>
<text x="26" y="280" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">KPMG fører 125 000 som mottatt.</text>
<text x="26" y="296" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">Håndskrevet «100,000» på sjekken er</text>
<text x="26" y="312" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">ikke forklart.</text>
<rect x="12" y="338" width="266" height="66" fill="#f6f3eb" stroke="#cbd0c5"/>
<rect x="12" y="338" width="4" height="66" fill="#23312f"/>
<text x="26" y="358" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">1.11.2017 · 100 000 dollar</text>
<text x="26" y="374" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">Sjekk fra Gratitude America.</text>
<text x="26" y="390" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">KPMG fant den i IPIs regnskap.</text>
<rect x="12" y="416" width="266" height="66" fill="#f6f3eb" stroke="#cbd0c5"/>
<rect x="12" y="416" width="4" height="66" fill="#23312f"/>
<text x="26" y="436" font-size="14" fill="#23312f" font-family="Arial, Helvetica, sans-serif" font-weight="700">5.4.2019 · 150 000 dollar</text>
<text x="26" y="452" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">Sjekk fra Gratitude America.</text>
<text x="26" y="468" font-size="13" fill="#23312f" font-family="Arial, Helvetica, sans-serif">KPMG fant den i IPIs regnskap.</text>
<text x="12" y="508" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">IPI har selv oppgitt fem gaver fra</text>
<text x="12" y="524" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Epstein-stiftelser på til sammen 650 000</text>
<text x="12" y="540" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">dollar i 2011–2019. Tre av dem er i</text>
<text x="12" y="556" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">utvalget. KPMGs gjennomgang fra desember</text>
<text x="12" y="572" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">2020 dekker januar 2010 til oktober 2020.</text>
<text x="12" y="588" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">Dokumentene viser ikke at pengene til IPI og</text>
<text x="12" y="604" font-size="13" fill="#58645e" font-family="Arial, Helvetica, sans-serif">til Rød-Larsen henger sammen.</text>
</svg>
