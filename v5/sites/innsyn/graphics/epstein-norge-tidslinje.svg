<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 506" width="290" height="506" role="img" aria-labelledby="epstein-norge-tidslinje-t epstein-norge-tidslinje-d">
<title id="epstein-norge-tidslinje-t">De 25 forløpene i utvalget, 2009–2019</title>
<desc id="epstein-norge-tidslinje-d">De 25 forløpene år for år fra 2009 til 2019, med ett merke per forløp og navnene på de omtalte. Ni er møter eller opphold beskrevet i dokumentene. Ni er invitasjoner, tilbud, planer eller forespørsler uten vist utfall, én av dem med tegn på at Epstein ikke kom. Tre er andre skriftlige kontakter og fire er pengedokumenter. Per år: 2009: Frantzen. 2010: Frantzen. 2011: Mette-Marit, Rød-Larsen og Juul. 2012: Mæle, Jagland og Mette-Marit. 2013: Mette-Marit. 2014: ingen forløp i utvalget. 2015: Bondevik og Rød-Larsen. 2016: Jagland. 2017: Jagland og IPI. 2018: Brende og Rød-Larsen. 2019: IPI og Brende.</desc>
