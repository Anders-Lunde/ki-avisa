id: innsyn
name: KI-avisa
handle: ''
project:
  operating_model: Eieren fastsetter mandatet. KI-redaksjonen velger og undersøker
    saker, innhenter dokumenter, sender og følger opp henvendelser, skriver og kvalitetssikrer
    journalistikken.
  purpose: Norsk undersøkende journalistikk om makt, offentlige penger og samfunn.
    Redaksjonen etterprøver alle aktører, også KI-partiet. Journalistikkens faktagrunnlag
    og vinkler bestemmes uavhengig av partiprosjektets forslag.
  topic_category: korrupsjon, lovbrudd, habilitet, politi- og rettssaker, sløsing
    og offentlige anskaffelser, makt og ansvar, strømpris, oljepris, skatt, energi-
    og innvandringspolitikk
theme:
  promise: Vi undersøker makten, følger pengene og forklarer det som angår deg.
  audience: Et bredt norskspråklig publikum uten krav om forkunnskaper.
episode:
  target_minutes: 15
  format: Én selvstendig undersøkelse eller forklaringssak. Briefen bestemmer lengden;
    normalt 8–15 minutter for forklaringer og 15–30 for dokumentarer.
  style: Naturlig muntlig bokmål. Konkret, presist, nysgjerrig og engasjerende; dokumenterte
    hendelser og menneskelige konsekvenser driver historien.
  duration_guidance: Tilpass omfanget til dokumentasjonen. Ikke fyll ut en svak sak
    med spekulasjon. Lengde og ordtall er plananslag frem til stemmen er målt.
workflow:
  agent_analytics_enabled: false
  first_draft_before_media_inventory: false
  first_draft_writer_brief_only: false
  paper_visual_rights_enabled: true
  series_digest_enabled: false
  draft_editorial_review_enabled: true
  draft_fact_review_enabled: true
  allow_non_video_opening: true
  still_motion_enabled: true
  animation_assets_enabled: true
  sound_design_enabled: false
  youtube_shorts_enabled: false
  voice_casting_enabled: false
  episode_narrator_voice_casting_enabled: false
  chapter_title_cards: true
  chapter_title_card_scope: intro_only
  chapter_title_card_mode: insert
  chapter_title_card_duration_seconds: 4.0
  shot_labels: true
  ai_media_badge: true
  narration_qa_enabled: false
  final_shot_linger_seconds: 3.0
narration:
  mode: tts
narration_tts:
  voice: Kore
  speaker: Narrator
  execution_mode: batch
  generations_per_beat: 1
  preceding_context_sentences: 0
  between_beat_pause_ms: 700
  direction: Voksen kvinnelig norsk journalist med naturlig bokmål og tydelig norsk
    uttale. Saklig, våken, presis og direkte, med troverdighet og et lett samtalepreg.
    Les noe raskere enn en rolig dokumentarforteller, omtrent 10–15 prosent raskere,
    med jevn fremdrift og korte naturlige pauser. Kom rett til poenget. La setningene
    henge sammen uten lange dramatiske opphold. Tall, poenger og nødvendige forbehold
    skal fortsatt være lette å oppfatte. Unngå reklamepreg, overdrevet nyhetsanker-stil,
    amerikansk aksent, hvisking og krimdramatikk. Les bare den oppgitte teksten, uten
    innledning eller avslutning.
